<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220">
  <!-- Papierkörnung (feines Rauschen), wird als Kachel über Hintergrund und Karten gelegt -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.32  0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 -0.9 0.42"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
